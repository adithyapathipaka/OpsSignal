# opssignal configuration
#
# Place this file at ./signal.yaml or set $SIGNAL_CONFIG to its path.
# Environment variable interpolation (${VAR}) is supported for secrets.
#
# NOTE: unmatched signals always fall back to the console provider —
# this is a hard-coded invariant in the routing engine, not something
# you can disable. See architecture docs for why.

providers:
  console:
    enabled: true
  slack:
    webhook_url: "${SLACK_WEBHOOK_URL}"
    # Optional: reshape the message (Jinja syntax; see docs/templates.md).
    # template:
    #   text: "{{ emoji }} [{{ environment | default('no env') }}] *{{ title }}*"
  # pagerduty:
  #   routing_key: "${PAGERDUTY_ROUTING_KEY}"
  # teams:
  #   webhook_url: "${TEAMS_WEBHOOK_URL}"
  # opsgenie:
  #   api_key: "${OPSGENIE_API_KEY}"
  # email:
  #   from: "OpsSignal <alerts@example.com>"
  #   to: [data-oncall@example.com]
  #   smtp:
  #     host: smtp.example.com
  #     username: "${SMTP_USERNAME}"
  #     password: "${SMTP_PASSWORD}"

routes:
  - match:
      severity: [error, critical]
      environment: prod
    providers:
      - slack
    # Send each incident at most once per 30 minutes, and at most
    # 20 signals an hour on this route.
    # dedup: 30m
    # rate_limit:
    #   max: 20
    #   per: 1h
  - match:
      severity: [warning]
    providers:
      - console

storage:
  sink: sqlite
  path: "./signals.db"
