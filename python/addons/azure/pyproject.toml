[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "opssignal-azure"
version = "0.1.0"
description = "Azure support for opssignal (Blob Storage, App Configuration, Cosmos DB, Key Vault)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
]

[tool.maturin]
python-source = "."
module-name = "opssignal_azure._azure"
manifest-path = "../../../crates/python-azure/Cargo.toml"
