[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "opssignal-gcp"
version = "0.1.0"
description = "Google Cloud support for opssignal (Cloud Storage, Firestore, Secret Manager)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
]

[tool.maturin]
python-source = "."
module-name = "opssignal_gcp._gcp"
manifest-path = "../../../crates/python-gcp/Cargo.toml"
