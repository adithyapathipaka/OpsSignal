[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "opssignal"
version = "0.1.0"
description = "Cross-language operational signal SDK for backend applications"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=7",
    "ruff>=0.4",
    "bandit>=1.7",
]

[tool.maturin]
python-source = "."
module-name = "opssignal._native"
manifest-path = "../crates/python/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101", # assert statements are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
