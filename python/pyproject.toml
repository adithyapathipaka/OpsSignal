[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "opssignal"
version = "0.1.0"
description = "Cross-language operational signal SDK for backend applications"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["notifications", "alerting", "slack", "webhook", "observability", "airflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/adithyapathipaka/OpsSignal"
Documentation = "https://adithyapathipaka.github.io/OpsSignal/"
Source = "https://github.com/adithyapathipaka/OpsSignal"
Issues = "https://github.com/adithyapathipaka/OpsSignal/issues"

[project.optional-dependencies]
# Each installs a native add-on that opssignal picks up on its own.
aws = ["opssignal-aws==0.1.0"]    # SIGNAL_CONFIG=s3://bucket/key
gcp = ["opssignal-gcp==0.1.0"]    # SIGNAL_CONFIG=gs://bucket/object
azure = ["opssignal-azure==0.1.0"]  # SIGNAL_CONFIG=az://container/blob
all = ["opssignal-aws==0.1.0", "opssignal-gcp==0.1.0", "opssignal-azure==0.1.0"]

[tool.maturin]
python-source = "."
module-name = "opssignal._native"
manifest-path = "../crates/python/Cargo.toml"

