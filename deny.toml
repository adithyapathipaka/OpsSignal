[graph]
targets = []

[advisories]
version = 2
# Deny crates with known security vulnerabilities.
yanked = "deny"

[licenses]
version = 2
# Permit common permissive and weak-copyleft licenses used in the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "OpenSSL",
]
# Ring uses a custom license that is effectively MIT+ISC.
exceptions = [
    { allow = ["ISC", "MIT", "OpenSSL"], name = "ring" },
]

[bans]
# Deny multiple versions of the same crate (forces dependency consolidation).
multiple-versions = "warn"
# Deny crates that are not needed in a security-sensitive library.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
