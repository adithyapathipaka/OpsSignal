name: Docs

# Publishes one copy of the site per version with mike, on the gh-pages
# branch:
#   - every merge to main updates "dev" (unreleased docs)
#   - every release tag vX.Y.Z[-beta.N] adds "X.Y.Z[-beta.N]" and, when it is
#     the highest tag, moves the "latest" alias (the site's default) to it
#   - Run workflow with a tag backfills that tag's docs
# Each version carries its own Rust API reference under rust/.
# PRs build only when the site itself changed; rustdoc is checked by the
# merge build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "overrides/**"
      - "crates/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v1.0.0-beta.1. Leave empty to publish dev from main."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Unquoted on purpose: steps expand $MKDOCS unquoted, so quotes would stay literal.
  MKDOCS: uvx --from mkdocs-material==9.7.7 --with mkdocs<2 --with mike==2.1.3

jobs:
  build:
    name: Build docs site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build site
        run: $MKDOCS mkdocs build --strict

  publish:
    name: Publish versioned docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mike pushes to gh-pages
    steps:
      - name: Pick version
        id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            ref="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            ref="$GITHUB_REF_NAME"
          else
            ref=""
          fi
          if [ -n "$ref" ]; then
            if ! echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
              echo "::error::$ref is not a release tag (vX.Y.Z or vX.Y.Z-beta.N)"; exit 1
            fi
            echo "ref=refs/tags/$ref" >> "$GITHUB_OUTPUT"
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}
          fetch-depth: 0  # tags, to decide whether this is the newest release
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v3
      - name: Add the version selector to older tags
        # Tags cut before versioned docs have no mike provider in mkdocs.yml.
        run: |
          grep -q "provider: mike" mkdocs.yml || printf '\nextra:\n  version:\n    provider: mike\n' >> mkdocs.yml
      - name: Build Rust API reference into the site
        run: |
          cargo doc --no-deps -p opssignal-core
          mkdir -p docs/rust
          cp -r target/doc/. docs/rust/
      - name: Check the site builds
        run: $MKDOCS mkdocs build --strict
      - name: Deploy with mike
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages --depth=1 || true
          if [ "$VERSION" = dev ]; then
            $MKDOCS mike deploy --push dev
          else
            newest=$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | head -n1)
            if [ "$TAG" = "$newest" ]; then
              $MKDOCS mike deploy --push --update-aliases "$VERSION" latest
              $MKDOCS mike set-default --push latest
            else
              $MKDOCS mike deploy --push "$VERSION"
            fi
          fi
          $MKDOCS mike list
