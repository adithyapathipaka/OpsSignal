name: CI

# Tests run on pull requests only, not on pushes to main: branch
# protection requires "Tests passed" before a PR can merge.
on:
  pull_request:

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip the Rust and Python builds, which use most of the
  # Actions minutes. Every other change runs everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!mkdocs.yml'
              - '!.github/workflows/docs.yml'

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest  # compile-heavy: needs more than ubuntu-slim's single core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The workspace build turns on the cloud add-ons' features; check
      # that core still builds and passes without them.
      - name: Core without cloud features
        run: |
          cargo clippy -p opssignal-core --all-targets -- -D warnings
          cargo test -p opssignal-core
      # Cloud code ships only in cloud builds: the base CLI and C library
      # must not link object_store, and each cloud variant must build.
      - name: CLI and C library cloud variants
        run: |
          for crate in opssignal-cli opssignal-ffi; do
            if cargo tree -p "$crate" -e normal --prefix none | grep -q '^object_store '; then
              echo "::error::$crate pulls in cloud code without a cloud feature"
              exit 1
            fi
            for feature in aws gcp azure; do
              cargo clippy -p "$crate" --features "$feature" -- -D warnings
            done
          done

  rust-security:
    name: Rust security (cargo-audit, cargo-deny)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binaries: `cargo install` compiled both tools from
      # source on every run, which took over 6 minutes.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit dependencies for known CVEs
        run: cargo audit
      - name: Check licenses and bans
        run: cargo deny check

  python:
    name: Python bindings (maturin + pytest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest  # compile-heavy: needs more than ubuntu-slim's single core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v3
      - name: Install dev tools
        run: uv sync --dev
      - name: Build extension
        run: cd python && uv run --project .. maturin develop
      # One add-on is enough to test the extras path end to end; the gcp
      # and azure crates are compiled and linted in the Rust job, and
      # their "install the extra" errors are tested here uninstalled.
      - name: Build the opssignal-aws add-on
        run: cd python/addons/aws && uv run --project ../../.. maturin develop
      - name: Run tests
        run: uv run pytest --tb=short -q

  ast-grep:
    name: ast-grep structural lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      - name: Run all rules
        run: sg scan --config sgconfig.yml

  python-lint:
    name: Python lint and security (ruff, bandit)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install dev tools
        run: uv sync --dev
      - name: ruff lint
        run: uv run ruff check python/opssignal python/tests python/addons scripts
      - name: ruff format check
        run: uv run ruff format --check python/opssignal python/tests python/addons scripts
      - name: bandit security scan
        run: uv run bandit -r python/opssignal/ python/addons/ -ll
      - name: Package versions agree
        run: uv run --no-project --python 3.12 scripts/check_versions.py
      # Prove set_version.py still finds every version a release tag
      # rewrites, so the next release doesn't find out instead.
      - name: Try setting a version
        run: |
          uv run --no-project --python 3.12 scripts/set_version.py 99.0.0-rc.1
          uv run --no-project --python 3.12 scripts/check_versions.py v99.0.0-rc.1

  claude-md-integrity:
    name: Check CLAUDE.md for hidden unicode
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Scan for zero-width / invisible unicode in CLAUDE.md
        run: |
          if [ -f CLAUDE.md ]; then
            python3 - <<'PYEOF'
          import sys
          suspicious = ['​', '‌', '‍', '﻿']
          with open('CLAUDE.md', encoding='utf-8') as f:
              content = f.read()
          found = [hex(ord(c)) for c in content if c in suspicious]
          if found:
              print(f"Suspicious invisible unicode characters found: {found}")
              sys.exit(1)
          print("CLAUDE.md clean.")
          PYEOF
          else
            echo "No CLAUDE.md present, skipping."
          fi

  # The one check branch protection requires. Its name stays stable when
  # jobs are added or renamed above: add every new job to `needs`. Jobs
  # skipped on a docs-only PR count as passed; failed or cancelled don't.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [changes, rust, rust-security, python, ast-grep, python-lint, claude-md-integrity]
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless every job succeeded or was skipped as docs-only
        if: >-
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
