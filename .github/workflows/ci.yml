name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  rust-security:
    name: Rust security (cargo-audit, cargo-deny)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for known CVEs
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses and bans
        run: cargo deny check

  python:
    name: Python bindings (maturin + pytest)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install maturin
      - name: Create virtualenv
        run: python -m venv python/.venv
      - name: Build extension
        working-directory: python
        run: |
          source .venv/bin/activate
          maturin develop
      - name: Run tests
        working-directory: python
        run: |
          source .venv/bin/activate
          pip install pytest
          pytest

  python-lint:
    name: Python lint and security (ruff, bandit)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install ruff bandit
      - name: ruff lint
        working-directory: python
        run: ruff check .
      - name: ruff format check
        working-directory: python
        run: ruff format --check .
      - name: bandit security scan
        working-directory: python
        run: bandit -r opssignal/ -ll

  claude-md-integrity:
    name: Check CLAUDE.md for hidden unicode
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Scan for zero-width / invisible unicode in CLAUDE.md
        run: |
          if [ -f CLAUDE.md ]; then
            python3 - <<'PYEOF'
          import sys
          suspicious = ['​', '‌', '‍', '﻿']
          with open('CLAUDE.md', encoding='utf-8') as f:
              content = f.read()
          found = [hex(ord(c)) for c in content if c in suspicious]
          if found:
              print(f"Suspicious invisible unicode characters found: {found}")
              sys.exit(1)
          print("CLAUDE.md clean.")
          PYEOF
          else
            echo "No CLAUDE.md present, skipping."
          fi
