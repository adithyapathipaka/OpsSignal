[package]
name = "opssignal-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Ships as prebuilt wheels on PyPI, not on crates.io.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# No cloud features: the base wheel reads local files and https only.
# S3, GCS and Azure come from the opssignal-aws/-gcp/-azure add-on
# wheels (crates/python-aws, -gcp, -azure), installed as pip extras.
opssignal-core = { path = "../core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
