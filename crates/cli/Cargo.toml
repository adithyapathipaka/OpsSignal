[package]
name = "opssignal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "opssignal"
path = "src/main.rs"

[dependencies]
opssignal-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }

[features]
# Shipped builds can read SIGNAL_CONFIG from S3 and GCS. Build with
# --no-default-features for a smaller binary that reads files and https only.
default = ["s3", "gcs"]
s3 = ["opssignal-core/s3"]
gcs = ["opssignal-core/gcs"]
